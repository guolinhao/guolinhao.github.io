<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学方程式听写系统（高考版）</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #00cec9;
            --accent-color: #fd79a8;
            --dark-color: #2d3436;
            --light-color: #dfe6e9;
            --combination-color: #74b9ff;
            --decomposition-color: #a29bfe;
            --replacement-color: #fdcb6e;
            --double-color: #55efc4;
            --other-color: #81ecec;
            --neutral-color: #ffeaa7;
            --substitute-color: #ff9f43;
            --addition-color: #00d2d3;
            --eliminate-color: #ff6b6b;
            --polyadd-color: #54a0ff;
            --polycond-color: #5f27cd;
            --card-bg: rgba(255, 255, 255, 0.98);
            --shadow-soft: 0 4px 20px rgba(108, 92, 231, 0.08);
            --shadow-hover: 0 8px 30px rgba(108, 92, 231, 0.15);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0c0c2d 0%, #1a1a4e 30%, #2d1b69 60%, #0f3460 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            perspective: 1000px;
            overflow-x: hidden;
            position: relative;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
            border-radius: 4px;
        }
        
        /* 方格网格背景 */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* 鼠标跟随光晕 */
        .mouse-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.18) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
            transition: left 0.12s ease-out, top 0.12s ease-out;
        }
        
        .container {
            width: 98%;
            max-width: 1700px;
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 25px 80px rgba(108, 92, 231, 0.25), 0 0 60px rgba(0, 206, 201, 0.1);
            transform: rotateY(-2deg) rotateX(1deg);
            transition: transform 0.5s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 1;
            backdrop-filter: blur(10px);
        }
        
        .container:hover {
            transform: rotateY(-0.5deg) rotateX(0.5deg);
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #6c5ce7, #00cec9, #fd79a8, #fdcb6e, #55efc4);
            z-index: 2;
        }
        
        h1 {
            text-align: center;
            color: var(--dark-color);
            margin-bottom: 24px;
            font-size: 2.8rem;
            letter-spacing: 2px;
            position: relative;
            padding-bottom: 18px;
            background: linear-gradient(135deg, #6c5ce7, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 30%;
            width: 40%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
            border-radius: 2px;
        }
        
        .main-content {
            display: flex;
            gap: 28px;
            flex: 1;
        }
        
        .left-panel {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 25px;
            transition: flex 0.3s;
        }
        
        .left-panel.full-width {
            flex: 5;
        }
        
        .right-panel {
            flex: 2;
            background-color: rgba(248, 249, 250, 0.95);
            border-radius: 18px;
            padding: 22px;
            box-shadow: var(--shadow-soft);
            max-height: 850px;
            overflow-y: auto;
            border-left: 6px solid var(--primary-color);
            transition: all 0.3s;
        }
        
        .right-panel.hidden {
            display: none;
        }

        /* 反应类型介绍栏 */
        .type-intro {
            background: linear-gradient(135deg, rgba(108,92,231,0.08), rgba(0,206,201,0.08));
            border: 1px solid rgba(108,92,231,0.2);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }
        .type-intro h4 {
            color: var(--primary-color);
            font-size: 1.15rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .type-intro .intro-desc {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 4px;
        }
        .type-intro .intro-formula {
            font-family: 'Consolas', monospace;
            color: var(--dark-color);
            font-weight: 600;
            background: rgba(255,255,255,0.7);
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-right: 10px;
        }
        .type-intro .intro-feature {
            color: #666;
            font-size: 0.9rem;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 22px;
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            border-radius: 16px;
            box-shadow: var(--shadow-soft);
        }
        
        .timer {
            font-size: 2.6rem;
            font-weight: bold;
            color: var(--secondary-color);
            background-color: white;
            padding: 14px 28px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 206, 201, 0.2);
            min-width: 200px;
            text-align: center;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        
        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        #startBtn {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
        }
        
        #resetBtn {
            background: linear-gradient(135deg, #e17055, #fd79a8);
            color: white;
        }
        
        #showAnswersBtn {
            background: linear-gradient(135deg, #6c5ce7, #74b9ff);
            color: white;
        }
        
        #toggleLibraryBtn {
            background: linear-gradient(135deg, #636e72, #b2bec3);
            color: white;
            padding: 10px 18px;
            font-size: 0.95rem;
        }
        
        #settingsBtn {
            background: linear-gradient(135deg, #fdcb6e, #e17055);
            color: white;
            padding: 10px 18px;
            font-size: 0.95rem;
        }
        
        .panels {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .panel {
            background-color: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: var(--shadow-soft);
            transition: transform 0.3s, box-shadow 0.3s;
            border-left: 6px solid var(--primary-color);
        }
        
        .panel:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        
        .question-panel {
            background: linear-gradient(135deg, #f8f9fa, #ffffff);
            min-height: 350px;
        }
        
        .answer-panel {
            background: linear-gradient(135deg, #f1f8ff, #e8f8f5);
            min-height: 250px;
            display: none;
        }
        
        h2 {
            color: var(--dark-color);
            margin-bottom: 20px;
            font-size: 1.7rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        h2 i {
            color: var(--primary-color);
        }
        
        .question-list {
            list-style-type: none;
            counter-reset: question-counter;
        }
        
        .question-list li {
            margin-bottom: 22px;
            padding-left: 50px;
            position: relative;
            font-size: 1.4rem;
            line-height: 1.8;
            color: #34495e;
            font-weight: 500;
        }
        
        .question-list li::before {
            counter-increment: question-counter;
            content: counter(question-counter);
            position: absolute;
            left: 0;
            top: 2px;
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #6c5ce7, #74b9ff);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 3px 10px rgba(108, 92, 231, 0.3);
        }
        
        .answer-list {
            list-style-type: none;
        }
        
        .answer-list li {
            margin-bottom: 22px;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
            border-left: 4px solid var(--secondary-color);
            line-height: 1.8;
            color: var(--dark-color);
        }
        
        .answer-list strong {
            font-size: 1.3rem;
            color: var(--dark-color);
        }
        
        .equation {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 2rem;
            margin-top: 10px;
            padding: 12px 18px;
            background: linear-gradient(135deg, #fff9e6, #ffeaa7);
            border-radius: 12px;
            display: inline-block;
            font-family: 'Consolas', 'Courier New', monospace;
            letter-spacing: 1px;
            text-align: center;
            min-width: 60%;
            box-shadow: 0 3px 8px rgba(253, 203, 110, 0.3);
        }
        
        .counter {
            display: inline-block;
            margin-left: 15px;
            font-size: 0.95rem;
            color: #7f8c8d;
            background-color: var(--light-color);
            padding: 4px 12px;
            border-radius: 20px;
        }
        
        .reaction-type {
            display: inline-block;
            margin-left: 10px;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
        }
        
        .combination { background-color: var(--combination-color); }
        .decomposition { background-color: var(--decomposition-color); }
        .replacement { background-color: var(--replacement-color); }
        .double-displacement { background-color: var(--double-color); }
        .other { background-color: var(--other-color); }
        .neutralization { background-color: var(--neutral-color); color: #333; }
        .substitute { background-color: var(--substitute-color); }
        .addition { background-color: var(--addition-color); }
        .eliminate { background-color: var(--eliminate-color); }
        .polyadd { background-color: var(--polyadd-color); }
        .polycond { background-color: var(--polycond-color); }
        
        /* 方程式库样式 */
        .library-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .library-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .library-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .search-box {
            padding: 9px 16px;
            border-radius: 20px;
            border: 1px solid #ddd;
            width: 220px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
            background: white;
        }
        
        .search-box:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(108,92,231,0.15);
        }
        
        .equation-item {
            background-color: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: var(--shadow-soft);
            border-left: 4px solid var(--primary-color);
            transition: all 0.3s;
        }
        
        .equation-item:hover {
            transform: translateX(6px);
            box-shadow: var(--shadow-hover);
        }
        
        .equation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .equation-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--dark-color);
            font-family: 'Consolas', 'Courier New', monospace;
        }
        
        .equation-desc {
            color: #555;
            margin-bottom: 10px;
            line-height: 1.5;
            font-size: 1.05rem;
        }
        
        .equation-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        
        .view-details {
            background: linear-gradient(135deg, #6c5ce7, #74b9ff);
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            box-shadow: none;
        }
        
        .view-details:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(108,92,231,0.3);
        }
        
        .exam-points {
            background-color: #fff9e6;
            border-left: 4px solid #fdcb6e;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }
        
        .exam-points.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        
        .exam-points h4 {
            color: #d35400;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.05rem;
        }
        
        .exam-points ul {
            padding-left: 20px;
            color: #555;
        }
        
        .exam-points li {
            margin-bottom: 5px;
            line-height: 1.5;
            font-size: 0.92rem;
        }
        
        .total-count {
            font-size: 1rem;
            color: var(--dark-color);
            font-weight: bold;
            background-color: rgba(108, 92, 231, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
        }
        
        .filter-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 7px 14px;
            background-color: #ecf0f1;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            box-shadow: none;
            color: #555;
            font-weight: 500;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #6c5ce7, #74b9ff);
            color: white;
            box-shadow: 0 4px 12px rgba(108,92,231,0.3);
        }
        .filter-btn:hover {
            transform: translateY(-2px);
        }
        
        /* 设置弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            background: white;
            border-radius: 22px;
            padding: 35px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
            animation: modalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(-20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .modal h3 {
            color: var(--dark-color);
            margin-bottom: 25px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .setting-item {
            margin-bottom: 22px;
        }
        
        .setting-item label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark-color);
            font-weight: 600;
            font-size: 1rem;
        }
        
        .setting-item input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
        }
        
        .setting-item input[type="number"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(108,92,231,0.15);
        }
        
        .setting-hint {
            font-size: 0.85rem;
            color: #999;
            margin-top: 5px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
        }
        
        #saveSettingsBtn {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
        }
        
        #cancelSettingsBtn {
            background: linear-gradient(135deg, #b2bec3, #636e72);
            color: white;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 1200px) {
            .main-content {
                flex-direction: column;
            }
            
            .right-panel {
                max-height: 550px;
            }
            
            .right-panel.hidden {
                display: none;
            }
            
            .left-panel.full-width {
                flex: 1;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 16px;
                transform: rotateY(-1deg) rotateX(0.5deg);
                border-radius: 18px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .timer {
                width: 100%;
            }
            
            .buttons {
                width: 100%;
                justify-content: center;
            }
            
            button {
                flex: 1;
                min-width: 120px;
            }
            
            .library-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .library-controls {
                width: 100%;
                justify-content: space-between;
            }
            
            .search-box {
                width: 100%;
            }
            
            .question-list li {
                font-size: 1.2rem;
                padding-left: 40px;
            }
            
            .equation {
                font-size: 1.6rem;
            }
        }
        
        .pulse {
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(253, 121, 168, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(253, 121, 168, 0); }
            100% { box-shadow: 0 0 0 0 rgba(253, 121, 168, 0); }
        }
        
        .chem-icon {
            font-size: 1.4rem;
            margin-right: 10px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 方格网格背景 -->
    <div class="grid-bg"></div>
    <!-- 鼠标跟随光晕 -->
    <div class="mouse-glow"></div>
    
    <div class="container">
        <h1><i class="fas fa-flask chem-icon"></i>化学方程式听写系统（高考版）</h1>
        
        <div class="main-content">
            <div class="left-panel" id="leftPanel">
                <div class="controls">
                    <div class="timer" id="timer">04:00</div>
                    <div class="buttons">
                        <button id="startBtn"><i class="fas fa-play"></i> 开始听写</button>
                        <button id="resetBtn"><i class="fas fa-redo"></i> 重置</button>
                        <button id="showAnswersBtn"><i class="fas fa-eye"></i> 显示答案</button>
                        <button id="settingsBtn"><i class="fas fa-cog"></i> 设置</button>
                        <button id="toggleLibraryBtn"><i class="fas fa-book"></i> 方程式库</button>
                    </div>
                </div>
                
                <div class="panels">
                    <div class="panel question-panel">
                        <h2><i class="fas fa-question-circle"></i> 听写题目 <span class="counter" id="questionCounter">随机选取5个方程式</span></h2>
                        <ul class="question-list" id="questionList">
                            <li>点击"开始听写"按钮开始练习</li>
                            <li>系统将从方程式库中随机选取题目</li>
                            <li>在规定时间内写出这些方程式</li>
                            <li>完成后可以点击"显示答案"核对</li>
                            <li>点击"设置"可以调整题目数量和时间</li>
                        </ul>
                    </div>
                    
                    <div class="panel answer-panel" id="answerPanel">
                        <h2><i class="fas fa-check-circle"></i> 参考答案</h2>
                        <ul class="answer-list" id="answerList">

        function updateTypeIntro(filterKey) {
            const info = reactionIntro[filterKey];
            if(!info) return;
            let html = `<h4><i class="fas fa-info-circle"></i> ${info.title}</h4>`;
            html += `<div class="intro-desc">${info.desc}</div>`;
            if(info.formula) html += `<span class="intro-formula">${info.formula}</span>`;
            if(info.feature) html += `<span class="intro-feature">${info.feature}</span>`;
            typeIntroEl.innerHTML = html;
        }
        
        // 初始化方程式库
        function initEquationLibrary() {
            equationLibraryContainer.innerHTML = '';
            
            // 过滤方程式
            let filteredEquations = equationLibrary;
            if (currentFilter !== 'all') {
                filteredEquations = equationLibrary.filter(eq => eq.type === currentFilter);
            }
            
            // 搜索过滤
            const searchTerm = searchBox.value.toLowerCase();
            if (searchTerm) {
                filteredEquations = filteredEquations.filter(eq => 
                    eq.description.toLowerCase().includes(searchTerm) || 
                    eq.equation.toLowerCase().includes(searchTerm)
                );
            }
            
            // 渲染方程式
            filteredEquations.forEach((eq, index) => {
                const equationItem = document.createElement('div');
                equationItem.className = 'equation-item';
                equationItem.innerHTML = `
                    <div class="equation-header">
                        <div class="equation-text">${eq.equation}</div>
                        <span class="reaction-type ${eq.type}">${getReactionTypeName(eq.type)}</span>
                    </div>
                    <div class="equation-desc">${eq.description}</div>
                    <div class="equation-footer">
                        <div>编号: ${index + 1}</div>
                        <button class="view-details" data-id="${index}">查看考点</button>
                    </div>
                    <div class="exam-points" id="exam-points-${index}">
                        <h4><i class="fas fa-graduation-cap"></i> 考点</h4>
                        <ul>
                            ${eq.examPoints.map(point => `<li>${point}</li>`).join('')}

                    </div>
                `;
                equationLibraryContainer.appendChild(equationItem);
            });

                    if (examPoints.classList.contains('show')) {
                        examPoints.classList.remove('show');
                        this.textContent = '查看考点';
                    } else {
                        examPoints.classList.add('show');
                        this.textContent = '隐藏考点';

                });
            });

        // 设置按钮
        settingsBtn.addEventListener('click', () => {
            questionCountInput.value = settings.questionCount;
            timeLimitInput.value = settings.timeLimit;
            settingsModal.classList.add('show');
        });
        
        // 保存设置
        saveSettingsBtn.addEventListener('click', () => {
            const count = parseInt(questionCountInput.value);
            const time = parseInt(timeLimitInput.value);
            
            if (count < 1 || count > 50) {
                alert('题目数量请输入1~50之间的数字');
                return;
            }
            if (time < 1 || time > 30) {
                alert('听写时间请输入1~30之间的数字');
                return;
            }
            
            settings.questionCount = count;
            settings.timeLimit = time;
            timeLeft = time * 60;
            updateTimerDisplay();
            updateQuestionCounter();
            
            settingsModal.classList.remove('show');
            
            // 重置问题列表提示
            if (!isRunning) {
                questionList.innerHTML = `
                    <li>点击"开始听写"按钮开始练习</li>
                    <li>系统将从方程式库中随机选取${settings.questionCount}个题目</li>
                    <li>您有${settings.timeLimit}分钟时间写出这些方程式</li>
                    <li>完成后可以点击"显示答案"核对</li>
                    <li>点击"设置"可以调整题目数量和时间</li>
                `;
            }
        });
        
        // 取消设置
        cancelSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.remove('show');
        });
        
        // 点击遮罩关闭设置
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('show');
            }
        });
        
        // 切换方程式库显示/隐藏
        toggleLibraryBtn.addEventListener('click', () => {
            isLibraryVisible = !isLibraryVisible;
            if (isLibraryVisible) {
                rightPanel.classList.remove('hidden');
                leftPanel.classList.remove('full-width');
            } else {
                rightPanel.classList.add('hidden');
                leftPanel.classList.add('full-width');
            }
        });
        
        // 隐藏方程式库按钮
        hideLibraryBtn.addEventListener('click', () => {
            rightPanel.classList.add('hidden');
            leftPanel.classList.add('full-width');
            isLibraryVisible = false;
        });
        
        // 搜索框事件
        searchBox.addEventListener('input', initEquationLibrary);
        
        // 过滤器按钮事件
        filterButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                filterButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                updateTypeIntro(currentFilter);
                initEquationLibrary();
            });
        });
        
        // 随机选择问题
        function getRandomQuestions(count) {
            const shuffled = [...equationLibrary].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }
        
        // 显示问题
        function displayQuestions(questions) {
            questionList.innerHTML = '';
            
            questions.forEach((q, index) => {
                const li = document.createElement('li');
                li.innerHTML = `${q.description} <span class="reaction-type ${q.type}">${getReactionTypeName(q.type)}</span>`;
                questionList.appendChild(li);
            });
        }
        
        // 显示答案
        function displayAnswers(questions) {
            answerList.innerHTML = '';
            
            questions.forEach((q, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <strong>${index + 1}. ${q.description}</strong><br>
                    <div class="equation">${q.equation}</div>
                    <span class="reaction-type ${q.type}">${getReactionTypeName(q.type)}</span>
                `;
                answerList.appendChild(li);
            });
        }
        
        // 获取反应类型名称
        function getReactionTypeName(type) {
            const typeNames = {
                'combination': '化合反应',
                'decomposition': '分解反应',
                'replacement': '置换反应',
                'double-displacement': '复分解反应',
                'substitute': '取代反应',
                'addition': '加成反应',
                'eliminate': '消去反应',
                'polyadd': '加聚反应',
                'polycond': '缩聚反应',
                'other': '其他反应'
            };
            return typeNames[type] || type;
        }
        
        // 更新计时器
        function updateTimer() {
            timeLeft--;
            updateTimerDisplay();
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                isRunning = false;
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fas fa-play"></i> 开始听写';
                startBtn.style.background = 'linear-gradient(135deg, #00b894, #00cec9)';
                
                timerElement.classList.remove('pulse');
                
                // 时间到自动显示答案
                displayAnswers(selectedQuestions);
                answerPanel.style.display = 'block';
                answerPanel.scrollIntoView({ behavior: 'smooth' });
            }
        }
        
        // 更新计时器显示
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 30) {
                timerElement.style.color = '#e74c3c';
                timerElement.style.animation = 'pulse 0.8s infinite';
            } else if (timeLeft <= 60) {
                timerElement.style.color = '#fdcb6e';
            } else {
                timerElement.style.color = '#00b894';
            }
        }

        // 鼠标跟随光晕效果
        document.addEventListener('mousemove', function(e) {
            const glow = document.querySelector('.mouse-glow');
            if(glow) {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
            }
        });
        
        // 初始化
        initEquationLibrary();
        updateTimerDisplay();
        updateQuestionCounter();
    </script>
</body>
</html>
